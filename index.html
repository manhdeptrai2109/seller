<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login - TManhios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title-glow">TMANHIOS SELLER</h1>
        <p class="subtitle">Đăng nhập để quản lý key</p>

        <div class="form-box">
            <label>Tên đăng nhập:</label>
            <input type="text" id="username" placeholder="Nhập username...">

            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">

            <button id="btn-login">ĐĂNG NHẬP</button>
        </div>

        <p id="msg"></p>
    </div>

    <script src="seller.js"></script>
</body>
</html>
